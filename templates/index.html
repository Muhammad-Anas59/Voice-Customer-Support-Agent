<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verve Athletics — Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root{
    --bg:#0B1220;
    --surface:#121B2E;
    --surface-2:#1A2740;
    --border: rgba(241,238,230,0.08);
    --text:#F1EEE6;
    --text-muted:#8B93A7;
    --gold:#F2B705;
    --gold-soft: rgba(242,183,5,0.14);
    --teal:#2DD4BF;
    --teal-soft: rgba(45,212,191,0.14);
    --coral:#FF6B5E;
    --coral-soft: rgba(255,107,94,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- Top bar --- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.3px;
  }
  .brand span{
    color: var(--text-muted);
    font-family:'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    margin-left: 10px;
  }
  .conn{
    display:flex;
    align-items:center;
    gap:7px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .conn-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-muted);
    transition: background 0.3s ease;
  }
  .conn-dot.ok{ background: var(--teal); }
  .conn-dot.warn{ background: var(--gold); }
  .conn-dot.err{ background: var(--coral); }

  /* --- Error banner --- */
  #errorBanner{
    display:none;
    background: var(--coral-soft);
    color: var(--coral);
    border-bottom: 1px solid rgba(255,107,94,0.25);
    padding: 10px 20px;
    font-size: 13.5px;
    text-align:center;
  }

  /* --- Hero mic section --- */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 36px 20px 22px;
    gap: 14px;
  }

  .mic-wrap{
    position: relative;
    width: 148px;
    height: 148px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .mic-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 1.5px solid var(--gold);
    opacity: 0;
    transform: scale(1);
  }
  .mic-wrap.listening .mic-ring{
    animation: ringPulse 1.6s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{ opacity:0.55; transform: scale(0.86); }
    70%{ opacity:0; transform: scale(1.35); }
    100%{ opacity:0; transform: scale(1.35); }
  }

  #micBtn{
    position:relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.25s ease, box-shadow 0.25s ease;
    z-index: 2;
  }
  #micBtn:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }
  #micBtn svg{ width: 38px; height: 38px; }
  #micBtn path, #micBtn rect, #micBtn circle{ fill: var(--text); transition: fill 0.25s ease; }

  .mic-wrap.listening #micBtn{
    background: var(--gold);
    box-shadow: 0 0 0 10px var(--gold-soft);
  }
  .mic-wrap.listening #micBtn path,
  .mic-wrap.listening #micBtn rect{ fill: var(--bg); }

  .mic-wrap.thinking #micBtn{
    background: var(--surface-2);
  }

  .mic-wrap.speaking #micBtn{
    background: var(--teal);
    box-shadow: 0 0 0 10px var(--teal-soft);
  }
  .mic-wrap.speaking #micBtn path,
  .mic-wrap.speaking #micBtn rect{ fill: var(--bg); }

  /* thinking dots, drawn inside the button */
  .think-dots{ display:none; gap:5px; }
  .mic-wrap.thinking .think-dots{ display:flex; }
  .mic-wrap.thinking #micBtn svg{ display:none; }
  .think-dots span{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-muted);
    animation: dotBounce 1.1s ease-in-out infinite;
  }
  .think-dots span:nth-child(2){ animation-delay: 0.15s; }
  .think-dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes dotBounce{
    0%,60%,100%{ transform: translateY(0); opacity:0.5; }
    30%{ transform: translateY(-5px); opacity:1; }
  }

  /* live level bars around the listening ring */
  #levelBars{
    position:absolute;
    inset:0;
    display:none;
  }
  .mic-wrap.listening #levelBars{ display:block; }
  #levelBars canvas{ width:100%; height:100%; }

  .state-label{
    font-family:'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--text-muted);
    min-height: 20px;
  }
  .mic-wrap.listening ~ .state-label{ color: var(--gold); }

  .hint{
    font-size: 12.5px;
    color: var(--text-muted);
    opacity: 0.75;
  }

  .live-caption{
    min-height: 18px;
    font-size: 13.5px;
    color: var(--text-muted);
    font-style: italic;
    padding: 0 24px;
    text-align:center;
  }

  /* --- Conversation history --- */
  .convo{
    flex:1;
    overflow-y: auto;
    padding: 10px 18px 24px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .empty-state{
    margin: auto;
    text-align:center;
    color: var(--text-muted);
    font-size: 13.5px;
    max-width: 260px;
    line-height: 1.5;
  }

  .msg{
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .msg.user{
    align-self:flex-end;
    background: var(--gold-soft);
    border: 1px solid rgba(242,183,5,0.28);
    border-bottom-right-radius: 4px;
  }
  .msg.agent{
    align-self:flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .escalated-flag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top: 7px;
    font-size: 11.5px;
    color: var(--coral);
    font-weight: 500;
  }
  .escalated-flag::before{
    content:"";
    width:5px; height:5px; border-radius:50%;
    background: var(--coral);
  }

  footer{
    padding: 10px 20px 18px;
    text-align:center;
    font-size: 11.5px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .mic-wrap.listening .mic-ring{ animation: none; }
    .think-dots span{ animation: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">Verve Athletics<span>Support</span></div>
    <div class="conn"><span class="conn-dot" id="connDot"></span><span id="connText">Connecting…</span></div>
  </header>

  <div id="errorBanner"></div>

  <div class="hero">
    <div class="mic-wrap" id="micWrap">
      <div class="mic-ring"></div>
      <div id="levelBars"><canvas id="levelCanvas"></canvas></div>
      <button id="micBtn" aria-label="Start talking to support" aria-live="polite">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15Z"/>
          <path d="M18.5 11.5a.75.75 0 0 0-1.5 0 5 5 0 0 1-10 0 .75.75 0 0 0-1.5 0 6.5 6.5 0 0 0 5.75 6.46V20h-2a.75.75 0 0 0 0 1.5h5.5a.75.75 0 0 0 0-1.5h-2v-2.04a6.5 6.5 0 0 0 5.75-6.46Z"/>
        </svg>
        <div class="think-dots"><span></span><span></span><span></span></div>
      </button>
    </div>
    <div class="state-label" id="stateLabel" role="status">Tap to talk</div>
    <div class="hint" id="hintText">We'll listen, answer, and speak the reply back to you.</div>
    <div class="live-caption" id="liveCaption" aria-live="polite"></div>
  </div>

  <div class="convo" id="convo">
    <div class="empty-state" id="emptyState">Ask about an order, shipping, returns, or anything else — your conversation will show up here.</div>
  </div>

  <footer>Verve Athletics · Voice Support</footer>
</div>

<audio id="player"></audio>

<script>
  const socket = io();
  const micWrap = document.getElementById("micWrap");
  const micBtn = document.getElementById("micBtn");
  const stateLabel = document.getElementById("stateLabel");
  const hintText = document.getElementById("hintText");
  const liveCaption = document.getElementById("liveCaption");
  const convo = document.getElementById("convo");
  const emptyState = document.getElementById("emptyState");
  const connDot = document.getElementById("connDot");
  const connText = document.getElementById("connText");
  const errorBanner = document.getElementById("errorBanner");
  const player = document.getElementById("player");
  const levelCanvas = document.getElementById("levelCanvas");

  let audioCtx, processor, source, stream, analyser;
  let sessionActive = false;
  let appState = "idle"; // idle | listening | thinking | speaking

  function setState(next){
    appState = next;
    micWrap.classList.remove("listening", "thinking", "speaking");
    if (next !== "idle") micWrap.classList.add(next);

    const labels = {
      idle: "Tap to talk",
      listening: "Listening…",
      thinking: "Thinking…",
      speaking: "Speaking — tap to interrupt"
    };
    stateLabel.textContent = labels[next];
    micBtn.setAttribute("aria-label", next === "idle" ? "Start talking to support" : "Stop and end session");
    hintText.style.display = next === "idle" ? "" : "none";
  }

  function addMessage(role, text, escalated){
    emptyState.remove?.();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (role === "agent" && escalated) {
      const flag = document.createElement("div");
      flag.className = "escalated-flag";
      flag.textContent = "Escalated to a team member";
      div.appendChild(flag);
    }
    convo.appendChild(div);
    convo.scrollTop = convo.scrollHeight;
  }

  // --- Socket events ---
  socket.on("connect", () => {
    connDot.className = "conn-dot ok";
    connText.textContent = "Connected";
    errorBanner.style.display = "none";
  });
  socket.on("disconnect", () => {
    connDot.className = "conn-dot err";
    connText.textContent = "Disconnected";
  });
  socket.on("status", (d) => {
    connDot.className = "conn-dot warn";
    connText.textContent = d.text;
  });
  socket.on("connection_error", (d) => {
    errorBanner.textContent = d.text;
    errorBanner.style.display = "block";
    connDot.className = "conn-dot err";
    connText.textContent = "Connection failed";
  });

  socket.on("partial_transcript", (d) => { liveCaption.textContent = d.text; });

  socket.on("still_busy", (d) => {
    liveCaption.textContent = d.text;
    setTimeout(() => {
      if (liveCaption.textContent === d.text) liveCaption.textContent = "";
    }, 2500);
  });

  socket.on("tts_failed", (d) => {
    liveCaption.textContent = d.text;
    if (sessionActive) setState("listening");
    setTimeout(() => {
      if (liveCaption.textContent === d.text) liveCaption.textContent = "";
    }, 3000);
  });

  socket.on("rate_limited", (d) => {
    liveCaption.textContent = d.text;
    if (sessionActive) setState("listening");
    setTimeout(() => {
      if (liveCaption.textContent === d.text) liveCaption.textContent = "";
    }, 3000);
  });

  socket.on("final_transcript", (d) => {
    liveCaption.textContent = "";
    addMessage("user", d.text);
    setState("thinking");
  });

  socket.on("agent_text", (d) => {
    addMessage("agent", d.text, d.escalated);
  });

  socket.on("agent_audio", (d) => {
    if (!sessionActive) return; // Stop was clicked before this arrived
    setState("speaking");
    const blob = b64ToBlob(d.audio_b64, d.mime);
    player.src = URL.createObjectURL(blob);
    player.play();
  });

  player.addEventListener("ended", () => {
    socket.emit("agent_audio_done");
    if (sessionActive) setState("listening");
  });

  function b64ToBlob(b64, mime){
    const bytes = atob(b64);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function downsampleTo16k(buffer, inputRate){
    const ratio = inputRate / 16000;
    const outLength = Math.floor(buffer.length / ratio);
    const out = new Int16Array(outLength);
    for (let i = 0; i < outLength; i++){
      const s = buffer[Math.floor(i * ratio)];
      out[i] = Math.max(-1, Math.min(1, s)) * 0x7fff;
    }
    return out;
  }

  // Real mic-level visualization drawn as radial bars around the button
  function drawLevels(){
    if (!analyser || appState !== "listening") return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);

    const ctx = levelCanvas.getContext("2d");
    const w = levelCanvas.width = levelCanvas.clientWidth * 2;
    const h = levelCanvas.height = levelCanvas.clientHeight * 2;
    ctx.clearRect(0, 0, w, h);

    const bars = 24;
    const cx = w / 2, cy = h / 2, radius = w / 2 - 6;
    for (let i = 0; i < bars; i++){
      const value = data[Math.floor(i * data.length / bars)] / 255;
      const len = 4 + value * 16;
      const angle = (i / bars) * Math.PI * 2;
      const x1 = cx + Math.cos(angle) * radius;
      const y1 = cy + Math.sin(angle) * radius;
      const x2 = cx + Math.cos(angle) * (radius + len);
      const y2 = cy + Math.sin(angle) * (radius + len);
      ctx.strokeStyle = "rgba(242,183,5,0.65)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    requestAnimationFrame(drawLevels);
  }

  async function startSession(){
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err){
      errorBanner.textContent = "Microphone access was blocked. Please allow mic permission and try again.";
      errorBanner.style.display = "block";
      return;
    }

    audioCtx = new AudioContext();
    source = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);

    processor.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = downsampleTo16k(input, audioCtx.sampleRate);
      socket.emit("audio_chunk", pcm16.buffer);
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);

    sessionActive = true;
    setState("listening");
    requestAnimationFrame(drawLevels);
  }

  function stopSession(){
    sessionActive = false;
    player.pause();
    player.currentTime = 0;
    player.removeAttribute("src");
    player.load();
    socket.emit("agent_audio_done");

    processor && processor.disconnect();
    source && source.disconnect();
    stream && stream.getTracks().forEach((t) => t.stop());
    liveCaption.textContent = "";
    setState("idle");
  }

  micBtn.addEventListener("click", () => {
    if (appState === "idle") startSession();
    else stopSession(); // works as "stop everything", including interrupting a spoken answer
  });
</script>
</body>
</html>
